<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<meta name="referrer" content="no-referrer" />
<title>Sales | s4digital</title>
<link rel="icon" type="image/png" href="/assets/32wh.png" />
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" />
<link rel="stylesheet" href="/assets/crm.css?v=3" />
<script>
  // Applied before first paint so the page never flashes light then dark.
  try {
    var t = localStorage.getItem('s4crm-theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>

<!-- ============================================================ SIGN IN -->
<div class="gate" id="gate" hidden>
  <form class="gate__card" id="loginForm" autocomplete="on">
    <img src="/assets/s4digital-logo.png" alt="s4digital" class="gate__logo logo-light" />
    <img src="/assets/s4digital-logo-white.png" alt="" aria-hidden="true" class="gate__logo logo-dark" />
    <h1>Sales</h1>
    <p class="gate__sub">Private. Sign in to work your call list.</p>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit" class="gate__go">Sign in</button>
    <p class="gate__err" id="gateErr" role="alert"></p>
  </form>
</div>

<!-- ======================================================== FIRST RUN -->
<div class="gate" id="setup" hidden>
  <form class="gate__card" id="setupForm">
    <img src="/assets/s4digital-logo.png" alt="s4digital" class="gate__logo logo-light" />
    <img src="/assets/s4digital-logo-white.png" alt="" aria-hidden="true" class="gate__logo logo-dark" />
    <h1>Create your account</h1>
    <p class="gate__sub">No account exists yet. This screen closes for good once one does.</p>
    <label for="sKey">Setup key</label>
    <input id="sKey" type="password" required />
    <label for="sEmail">Email</label>
    <input id="sEmail" type="email" autocomplete="username" required />
    <label for="sName">Name</label>
    <input id="sName" type="text" value="Earl" required />
    <label for="sPass">Password (10+ characters)</label>
    <input id="sPass" type="password" autocomplete="new-password" minlength="10" required />
    <label for="sPin">Quick unlock PIN (optional, 4 to 8 digits)</label>
    <input id="sPin" type="text" inputmode="numeric" pattern="\d{4,8}" />
    <button type="submit" class="gate__go">Create account</button>
    <p class="gate__err" id="setupErr" role="alert"></p>
  </form>
</div>

<!-- =========================================================== LOCKED -->
<div class="gate gate--lock" id="lock" hidden>
  <form class="gate__card gate__card--lock" id="lockForm">
    <div class="lock__dot"></div>
    <h1>Locked</h1>
    <p class="gate__sub" id="lockWho"></p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off"
           class="lock__pin" maxlength="8" placeholder="••••" />
    <button type="submit" class="gate__go">Unlock</button>
    <button type="button" class="gate__alt" id="lockOut">Sign out instead</button>
    <p class="gate__err" id="lockErr" role="alert"></p>
  </form>
</div>

<!-- ============================================================== APP -->
<div class="app" id="app" hidden>
  <header class="bar">
    <a href="/" class="bar__brand" title="s4digital">
      <img src="/assets/s4digital-logo.png" alt="s4digital" class="logo-light" />
      <img src="/assets/s4digital-logo-white.png" alt="" aria-hidden="true" class="logo-dark" />
      <span>Sales</span>
    </a>

    <nav class="bar__tabs" id="tabs">
      <button data-view="dashboard">Dashboard</button>
      <button data-view="today" class="is-active">Today</button>
      <button data-view="pipeline">Pipeline</button>
      <button data-view="prospects">Prospects</button>
      <button data-view="followups">Follow Ups<span class="dot" id="fuDot" hidden></span></button>
      <button data-view="import">Import</button>
      <button data-view="settings">Settings</button>
    </nav>

    <div class="bar__right">
      <div class="find">
        <input id="globalSearch" type="search" placeholder="Search  /" autocomplete="off" />
        <div class="find__out" id="searchOut" hidden></div>
      </div>
      <button class="icon theme" id="themeToggle" title="Light or dark (Ctrl+J)" aria-label="Switch theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon" id="lockNow" title="Lock (Ctrl+L)" aria-label="Lock">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
      </button>
      <button class="icon" id="signOut" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/>
        </svg>
      </button>
    </div>
  </header>

  <button class="bar__burger" id="burger" aria-label="Menu">Menu</button>

  <p class="notice" id="notice" hidden></p>

  <main id="view" class="view"></main>
</div>

<div class="toasts" id="toasts"></div>
<div class="modal" id="modal" hidden></div>
<aside class="drawer" id="drawer" hidden></aside>
<div class="scrim" id="scrim" hidden></div>

<script type="module" src="/assets/crm/app.js?v=3"></script>
<noscript><p style="padding:40px;font-family:system-ui">The sales area needs JavaScript.</p></noscript>
</body>
</html>
