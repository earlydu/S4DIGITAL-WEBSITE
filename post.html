<style>
  .article{max-width:760px;margin-inline:auto}
  .article__body{font-size:17px;line-height:1.75;color:var(--ink-2)}
  .article__body h2{font-size:clamp(24px,3vw,34px);font-weight:900;letter-spacing:-.025em;color:var(--ink);margin:38px 0 12px}
  .article__body h3{font-size:20px;font-weight:900;letter-spacing:-.02em;color:var(--ink);margin:30px 0 10px}
  .article__body p{margin:0 0 18px}
  .article__body ul,.article__body ol{margin:0 0 18px 22px}
  .article__body li{margin-bottom:8px}
  .article__body blockquote{border-left:3px solid var(--blue);padding-left:20px;margin:26px 0;font-weight:700;color:var(--ink)}
  .article__body img,.article__body video,.article__body iframe{width:100%;border-radius:16px;margin:24px 0}
  .article__body iframe{aspect-ratio:16/9;border:0}
  .article__body a{color:var(--blue);font-weight:700;text-decoration:underline}
  .article__meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:700}
  .article__cover{border-radius:var(--radius-lg);overflow:hidden;margin:36px 0 42px}
</style>
